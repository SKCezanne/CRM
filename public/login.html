<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container" style="max-width: 520px;">
        <header>
            <h1>CRM Login</h1>
        </header>
        <div style="padding: 24px;">
            <div class="sidebar-card" style="margin: 0;">
                <h3>Sign in</h3>
                <p class="muted" style="margin-bottom: 14px;">
                    Dummy credentials for testing:
                    <strong>admin / admin123</strong>
                </p>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <input id="username" type="text" value="admin" required />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input id="password" type="password" value="admin123" required />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                    <div id="loginError" class="muted" style="margin-top: 10px; color: #dc3545;"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function login(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.textContent = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');
                window.location.href = '/';
            } catch (ex) {
                err.textContent = ex.message || 'Login failed';
            }
        }
    </script>
</body>
</html>
